<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Webhook Soundboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    h1 {
      color: white;
      text-align: center;
      font-size: 3em;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      margin-bottom: 40px;
      font-size: 1.2em;
    }

    .connection-status {
      text-align: center;
      padding: 10px 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .connection-status.connected {
      background: rgba(76, 175, 80, 0.3);
      color: white;
    }

    .connection-status.disconnected {
      background: rgba(244, 67, 54, 0.3);
      color: white;
    }

    .enable-sound-btn {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 20px 40px;
      font-size: 1.3em;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
      transition: all 0.3s ease;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .enable-sound-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
    }

    .enable-sound-btn.enabled {
      background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
      cursor: default;
    }

    .enable-sound-btn.enabled:hover {
      transform: none;
    }

    .enable-sound-btn:hidden {
      display: none;
    }

    .qr-section {
      background: white;
      border-radius: 16px;
      padding: 40px;
      margin-bottom: 40px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .qr-title {
      font-size: 1.8em;
      color: #333;
      margin-bottom: 20px;
    }

    .qr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .qr-item {
      text-align: center;
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
    }

    .qr-sound-name {
      font-size: 1.3em;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }

    .qr-amount {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 15px;
    }

    .qr-code {
      background: white;
      padding: 15px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 15px;
    }

    .qr-code img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .qr-label {
      font-size: 0.75em;
      color: #999;
      word-break: break-all;
      font-family: monospace;
    }

    .sounds-section {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .sounds-title {
      font-size: 1.8em;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }

    .sounds-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .sound-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .sound-card.playing {
      animation: pulse 0.5s ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .sound-amount {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .sound-name {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .last-played {
      text-align: center;
      margin-top: 30px;
      padding: 20px;
      background: rgba(103, 126, 234, 0.2);
      border-radius: 8px;
      color: #333;
      font-size: 1.1em;
    }

    .footer {
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Webhook Soundboard</h1>
    <p class="subtitle">Scan the QR code to pay and trigger sounds!</p>

    <div class="connection-status" id="connectionStatus">
      🔌 Connecting...
    </div>

    <button class="enable-sound-btn" id="enableSoundBtn" onclick="enableSound()">
      🔊 Click to Enable Sound
    </button>

    <div class="qr-section">
      <h2 class="qr-title">Payment QR Code</h2>
      <div class="qr-grid" id="qrGrid">
        <!-- QR codes will be loaded here -->
      </div>
    </div>

    <div class="last-played" id="lastPlayed" style="display: none;">
      <!-- Last played sound info -->
    </div>

    <div class="footer">
      <p>Powered by Lightning Network ⚡</p>
    </div>
  </div>

  <script>
    let ws = null;
    let sounds = [];
    let reconnectTimeout = null;
    let soundEnabled = false;

    // Enable sound on user interaction
    function enableSound() {
      console.log('🔊 Enabling sound...');

      // Play a silent audio to unlock autoplay
      const silentAudio = new Audio();
      silentAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

      silentAudio.play()
        .then(() => {
          console.log('✅ Sound enabled!');
          soundEnabled = true;

          const btn = document.getElementById('enableSoundBtn');
          btn.textContent = '✅ Sound Enabled';
          btn.classList.add('enabled');
          btn.disabled = true;
        })
        .catch(err => {
          console.error('❌ Failed to enable sound:', err);
        });
    }

    // Initialize WebSocket connection
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('✅ WebSocket connected');
        updateConnectionStatus(true);
        if (reconnectTimeout) {
          clearTimeout(reconnectTimeout);
          reconnectTimeout = null;
        }
      };

      ws.onmessage = (event) => {
        try {
          console.log('📨 Raw WebSocket message:', event.data);
          const data = JSON.parse(event.data);
          console.log('📨 Parsed WebSocket message:', data);

          if (data.type === 'play-sound') {
            console.log('🎵 Attempting to play sound:', data);
            playSound(data.soundFile, data.amount, data.soundName);
          } else {
            console.log('⚠️ Unknown message type:', data.type);
          }
        } catch (error) {
          console.error('❌ Error parsing WebSocket message:', error);
        }
      };

      ws.onclose = () => {
        console.log('❌ WebSocket disconnected');
        updateConnectionStatus(false);

        // Attempt to reconnect after 3 seconds
        reconnectTimeout = setTimeout(() => {
          console.log('🔄 Attempting to reconnect...');
          connectWebSocket();
        }, 3000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };
    }

    // Update connection status display
    function updateConnectionStatus(connected) {
      const statusEl = document.getElementById('connectionStatus');
      if (connected) {
        statusEl.className = 'connection-status connected';
        statusEl.textContent = '✅ Connected';
      } else {
        statusEl.className = 'connection-status disconnected';
        statusEl.textContent = '❌ Disconnected - Reconnecting...';
      }
    }

    // Load QR codes
    async function loadQRCodes() {
      try {
        const response = await fetch('/api/lnurl');
        const data = await response.json();

        const qrGrid = document.getElementById('qrGrid');

        // Get sounds to pair with QR codes
        const soundsResponse = await fetch('/api/sounds');
        const soundsData = await soundsResponse.json();

        for (let i = 0; i < data.addresses.length && i < soundsData.length; i++) {
          const qrResponse = await fetch(`/api/qr/${i}`);
          const qrData = await qrResponse.json();
          const sound = soundsData[i];

          const qrItem = document.createElement('div');
          qrItem.className = 'qr-item';
          qrItem.innerHTML = `
            <div class="qr-sound-name">${sound.name}</div>
            <div class="qr-amount">⚡ 100 sats</div>
            <div class="qr-code">
              <img src="${qrData.qrCode}" alt="LNURL QR Code">
            </div>
            <div class="qr-label">${qrData.address}</div>
          `;
          qrGrid.appendChild(qrItem);
        }
      } catch (error) {
        console.error('Failed to load QR codes:', error);
      }
    }


    // Play sound
    function playSound(soundFile, amount, soundName) {
      console.log(`🔊 Playing: ${soundName} (${amount} sats)`);
      console.log(`🔊 Sound enabled: ${soundEnabled}`);

      if (!soundEnabled) {
        console.log('⚠️ Sound not enabled yet. Prompting user...');

        // Flash the enable sound button
        const btn = document.getElementById('enableSoundBtn');
        btn.style.animation = 'pulse 1s ease-in-out 3';
        setTimeout(() => {
          btn.style.animation = '';
        }, 3000);

        return;
      }

      // Play the audio
      const audio = new Audio(`/sounds/${soundFile}`);
      audio.play()
        .then(() => {
          console.log('✅ Audio playing successfully');
        })
        .catch(err => {
          console.error('❌ Failed to play sound:', err);
        });

      // Update last played
      const lastPlayed = document.getElementById('lastPlayed');
      lastPlayed.style.display = 'block';
      lastPlayed.textContent = `🎵 Last played: ${soundName} (${amount} sats) at ${new Date().toLocaleTimeString()}`;
    }

    // Initialize on page load
    connectWebSocket();
    loadQRCodes();
  </script>
</body>
</html>
